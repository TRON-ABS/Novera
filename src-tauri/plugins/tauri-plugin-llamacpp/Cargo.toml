[package]
name = "tauri-plugin-llamacpp"
version = "0.9.0"
authors = ["Jan <service@jan.ai>"]
description = "Tauri plugin for managing Jan LlamaCpp server processes and model loading"
license = "Apache-2.0"
repository = "https://github.com/janhq/jan"
edition = "2021"
rust-version = "1.77.2"
exclude = ["/examples", "/dist-js", "/guest-js", "/node_modules"]
links = "tauri-plugin-llamacpp"

[dependencies]
base64 = "0.23.1"
byteorder = "1.5.0"
hmac = "0.13.0"
jan-utils = { path = "../../utils" }
log = "0.4.35"
# Bearer tokens for the worker. The OS assigns the port, so the key cannot be
# derived from it; it is drawn from the OS CSPRNG instead.
rand = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.11.1"
tauri = { version = "2.12.5", default-features = false, features = [] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
tauri-plugin-hardware = { path = "../tauri-plugin-hardware" }
serde_json = "1.0.154"
futures-util = "0.3.34"
# The loopback OpenAI-compatible surface. Same versions the app crate already
# uses, so the workspace resolves one copy.
hyper = { version = "1.12.0", features = ["server", "http1"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
http-body-util = "0.1.5"
bytes = "1.12.1"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
reqwest = { version = "0.13.5", features = ["form", "query", "json", "blocking", "stream", "native-tls"] }

# lddtree's Mach-O handling has crashed in the field; we skip dep analysis on macOS.
[target.'cfg(not(any(target_os = "macos", target_os = "ios", target_os = "android")))'.dependencies]
lddtree = "0.5.1"

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
reqwest = { version = "0.13.5", features = ["form", "query", "json", "blocking", "stream", "rustls"], default-features = false }

# Unix-specific dependencies
[target.'cfg(unix)'.dependencies]
nix = { version = "0.31.3", features = ["signal", "process"] }

# The kill-on-close job object the worker is spawned into. Windows has no
# process group, so this is what keeps a force-quit Jan from orphaning it.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
  "Win32_Foundation",
  # CreateJobObjectW takes SECURITY_ATTRIBUTES, and the extended limit struct
  # lives behind Threading; both are gated separately from JobObjects itself.
  "Win32_Security",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
] }

# The supervised worker. `required-features` keeps it out of the default build,
# where there is no compiled llama.cpp to link against.
[[bin]]
name = "novera-llama-worker"
path = "src/bin/novera-llama-worker.rs"
required-features = ["engine"]

[features]
default = []
# Compiles and statically links llama.cpp (libllama + libcommon +
# server-context) plus the C shim. OFF by default: this crate is a
# non-optional dependency of the app crate, so enabling it unconditionally
# would put cmake and a C++ toolchain on the critical path of every
# `cargo check`, including the CLI-only job that never runs inference.
engine = []
# GPU backends. Each implies `engine`; they are separate build artifacts
# because each needs its own toolchain (nvcc per CUDA major, the Vulkan SDK,
# ROCm) and CUDA 12 and 13 cannot come from one compile.
engine-cuda = ["engine"]
engine-vulkan = ["engine"]
engine-hip = ["engine"]
engine-metal = ["engine"]

# Shared engine sources are also compiled by novera-inference, which owns
# this feature. Do not expose it as a usable Tauri plugin feature.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("headless"))'] }

[dev-dependencies]
tempfile = "3.27.0"
serde_json = "1.0.154"
reqwest = { version = "0.13.5", features = ["form", "query", "json"] }

[build-dependencies]
tauri-plugin = { version = "2.7.2", features = ["build"] }
# Pure-Rust and cheap when unused; it only shells out to a compiler if the
# `engine` feature actually asks for the native build.
cc = "1.11.0"

# GTK3 requires glib 0.18; apply the exact upstream RUSTSEC-2024-0429 fix.
[patch.crates-io]
glib = { path = "../../vendor/glib-0.18.5" }

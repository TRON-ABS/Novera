[package]
name = "tauri-plugin-mlx"
version = "0.8.3"
authors = ["Jan <service@jan.ai>"]
description = "Tauri plugin for managing MLX-Swift server processes and model loading on Apple Silicon"
license = "Apache-2.0"
repository = "https://github.com/janhq/jan"
edition = "2021"
rust-version = "1.77.2"
exclude = ["/examples", "/dist-js", "/guest-js", "/node_modules"]
links = "tauri-plugin-mlx"

[dependencies]
log = "0.4.35"
serde = { version = "1.0.229", features = ["derive"] }
sysinfo = "0.40.1"
tauri = { version = "2.12.5", default-features = false, features = [] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
jan-utils = { path = "../../utils" }

# Unix-specific dependencies (macOS)
[target.'cfg(unix)'.dependencies]
nix = { version = "0.31.3", features = ["signal", "process"] }

[build-dependencies]
tauri-plugin = { version = "2.7.2", features = ["build"] }

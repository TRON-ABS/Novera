[package]
name = "tauri-plugin-websearch"
version = "0.8.3"
authors = ["Jan <service@jan.ai>"]
description = "Tauri plugin providing native, provider-neutral web_search / web_fetch tools (Exa backend by default)"
license = "Apache-2.0"
repository = "https://github.com/janhq/jan"
edition = "2021"
rust-version = "1.77.2"
exclude = ["/examples", "/dist-js", "/guest-js", "/node_modules"]
links = "tauri-plugin-websearch"

[features]
default = ["tauri"]
# The Tauri command/plugin surface. Disabled by the headless `jan` CLI, which
# consumes `provider` directly and must not link any GUI crate.
tauri = ["dep:tauri"]

[dependencies]
async-trait = "0.1.92"
log = "0.4.35"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2.12.5", default-features = false, features = [], optional = true }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
reqwest = { version = "0.13.5", default-features = false, features = ["form", "query", "json", "rustls"] }

[build-dependencies]
tauri-plugin = { version = "2.7.2", features = ["build"] }

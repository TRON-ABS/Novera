[package]
name = "tauri-plugin-rag"
version = "0.1.0"
authors = ["Jan <service@jan.ai>"]
description = "Tauri plugin for RAG utilities (document parsing, types)"
license = "Apache-2.0"
repository = "https://github.com/janhq/jan"
edition = "2021"
rust-version = "1.88"
exclude = ["/examples", "/dist-js", "/guest-js", "/node_modules"]
links = "tauri-plugin-rag"

[dependencies]
tauri = { version = "2.12.5", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
log = "0.4.35"
pdf-extract = "0.12.1"
zip = { version = "9.4.1", default-features = false, features = ["deflate", "bzip2", "zstd"] }
quick-xml = { version = "0.42.0", features = ["serialize"] }
csv = "1.4.0"
calamine = "0.38.0"
html2text = "0.17.4"
chardetng = "1.0.0"
encoding_rs = "0.8.44"
infer = "0.22.0"

[build-dependencies]
tauri-plugin = { version = "2.7.2", features = ["build"] }

# GTK3 requires glib 0.18; apply the exact upstream RUSTSEC-2024-0429 fix.
[patch.crates-io]
glib = { path = "../../vendor/glib-0.18.5" }

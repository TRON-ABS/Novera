[package]
name = "tauri-plugin-hardware"
version = "0.8.3"
authors = ["Jan <service@jan.ai>"]
description = "Tauri plugin for hardware information and GPU monitoring"
license = "Apache-2.0"
repository = "https://github.com/janhq/jan"
edition = "2021"
rust-version = "1.77.2"
exclude = ["/examples", "/dist-js", "/guest-js", "/node_modules"]
links = "tauri-plugin-hardware"

[dependencies]
libc = "0.2.191"
log = "0.4.35"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2.12.5", default-features = false, features = ["test"] }

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
sysinfo = { version = "0.40.1", default-features = false, features = ["system"] }

# Desktop-only dependencies
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
sysinfo = "0.40.1"
vulkano = "0.35.2"
ash = "0.38.0"
nvml-wrapper = "0.13.0"

# Windows-specific dependencies
[target.'cfg(windows)'.dependencies]
libloading = "0.9.0"

[build-dependencies]
tauri-plugin = { version = "2.7.2", features = ["build"] }

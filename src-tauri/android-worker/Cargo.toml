[package]
name = "novera-android-worker"
version = "1.0.0"
edition = "2021"
license = "Apache-2.0"
publish = false

# A dedicated binary avoids enabling the native engine inside the UI process.
[[bin]]
name = "novera-llama-worker"
path = "../plugins/tauri-plugin-llamacpp/src/bin/novera-llama-worker.rs"

[dependencies]
tauri-plugin-llamacpp = { path = "../plugins/tauri-plugin-llamacpp", features = ["engine"] }
tokio = { version = "1.54.1", features = ["full"] }
serde_json = "1.0.154"

[profile.release]
opt-level = 3
lto = "thin"
strip = "symbols"
codegen-units = 1

# GTK3 requires glib 0.18; apply the exact upstream RUSTSEC-2024-0429 fix.
[patch.crates-io]
glib = { path = "../vendor/glib-0.18.5" }

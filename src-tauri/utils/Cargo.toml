[package]
name = "jan-utils"
version = "0.1.0"
edition = "2021"

[dependencies]
hex = "0.4.3"
base64 = "0.23.1"
hmac = "0.13.0"
log = { version = "0.4.35", optional = true }
rand = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tokio = { version = "1.54.1", features = ["process", "fs", "macros", "rt", "time"] }
tokio-util = "0.7.20"
url = "2.5.8"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
reqwest = { version = "0.13.5", features = ["form", "query", "json", "native-tls"] }

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
reqwest = { version = "0.13.5", features = ["form", "query", "json", "rustls"], default-features = false }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Storage_FileSystem"] }

[dev-dependencies]
tempfile = "3.27.0"

[features]
default = []
logging = ["log"]

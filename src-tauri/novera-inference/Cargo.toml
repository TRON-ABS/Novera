[package]
name = "novera-inference"
version = "0.9.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[features]
default = ["headless", "engine"]
headless = []
engine = []
engine-metal = ["engine"]

[dependencies]
bytes = "1.12.1"
futures-util = "0.3.34"
http-body-util = "0.1.5"
hyper = { version = "1.12.0", features = ["server", "http1"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
log = "0.4.35"
rand = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tokio = { version = "1.54.1", features = ["full"] }

[build-dependencies]
cc = "1.11.0"

[dev-dependencies]
tempfile = "3.27.0"

[package]
name = "novera-portable"
version = "1.0.0"
edition = "2021"
rust-version = "1.88"
license = "Apache-2.0"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_yaml = "0.9.34"
sha2 = "0.11.1"
zip = { version = "9.4.1", default-features = false, features = ["deflate-flate2"] }
flate2 = "1.1.10"

[dev-dependencies]
tempfile = "3.27.0"

[[bin]]
name = "Novera-Portable-Update"
path = "src/main.rs"

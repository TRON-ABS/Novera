[package]
name = "novera-portable"
version = "1.0.0"
edition = "2021"
rust-version = "1.88"
license = "Apache-2.0"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9.34"
sha2 = "0.10"
zip = { version = "4.6.1", default-features = false, features = ["deflate-flate2"] }
flate2 = "1"

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "Novera-Portable-Update"
path = "src/main.rs"

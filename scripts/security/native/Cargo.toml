[package]
name = "novera-security-validation"
version = "0.1.0"
edition = "2021"
publish = false

[features]
default = ["cli"]
cli = []
portable = []

[lib]
path = "lib.rs"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
rand = "0.10.3"
fs2 = "0.4.3"
aes-gcm = "0.11.1"
sha2 = "0.11.1"
hex = "0.4.3"
log = "0.4.35"
keyring = { version = "4.2.0", features = ["v1"] }
machine-uid = "0.6.0"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }
tempfile = "3.27.0"
pdf-extract = "0.12.1"
zip = { version = "9.4.1", default-features = false, features = ["deflate", "bzip2", "zstd"] }
quick-xml = { version = "0.42.0", features = ["serialize"] }
csv = "1.4.0"
calamine = "0.38.0"
html2text = "0.17.4"
chardetng = "1.0.0"
encoding_rs = "0.8.44"
infer = "0.22.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }

[target.'cfg(windows)'.dev-dependencies]
# Only creates a synthetic old-format credential to verify the v4 migration.
# This dependency is not part of any distributed Novera runtime.
keyring-v3 = { package = "keyring", version = "3.6.3", default-features = false, features = ["windows-native"] }

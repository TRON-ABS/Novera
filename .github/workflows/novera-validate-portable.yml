name: Novera - Validate exact portable candidate
on:
  workflow_call:
    inputs:
      candidate_run:
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  validate:
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      STATIC_VCRUNTIME: 'true'
      NOVERA_ANALYTICS_HOST: ''
      NOVERA_ANALYTICS_PROJECT_KEY: ''
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          package-manager-cache: false
      - name: Native validation toolchain
        shell: bash
        run: bash scripts/distribution/ci-prerequisites.sh desktop
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
        with:
          arch: x64
      - name: Select the native validation linker
        shell: pwsh
        run: ./scripts/distribution/ci-msvc.ps1
      - name: Verify the exact signed candidate and unchanged native sources
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CANDIDATE_RUN: ${{ inputs.candidate_run }}
        run: |
          python scripts/distribution/reuse-portable-candidate.py $env:CANDIDATE_RUN
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Prepare native updater probe and WebView2 driver
        shell: bash
        env:
          CARGO_BUILD_JOBS: 2
        run: |
          set -euo pipefail
          cargo build --locked --manifest-path scripts/distribution/checks/native-update/Cargo.toml --target-dir .build/native-update-probe
          mkdir -p .build/webview2-driver
          printf '{"private":true}' > .build/webview2-driver/package.json
          npm install --prefix .build/webview2-driver --ignore-scripts --no-audit --no-fund --save-exact playwright-core@1.56.1
      - name: Native portable profile, relocation and signed replacement checks
        shell: pwsh
        run: |
          ./scripts/distribution/ci-portable-user.ps1
          python scripts/distribution/validate-portable.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Retain actual screenshots and native receipts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: windows-portable-proof-${{ github.run_id }}
          path: .build/validation/
          if-no-files-found: ignore
          retention-days: 14
      - name: Remove the disposable standard UI account
        if: always()
        shell: pwsh
        run: ./scripts/distribution/ci-portable-user.ps1 -Action Remove

name: Novera - All distribution candidates
run-name: Novera candidates - ${{ inputs.target }} - ${{ github.sha }}

on:
  workflow_dispatch:
    inputs:
      target:
        description: Distribution variant to build
        required: true
        type: choice
        default: all
        options: [all, checks, native, desktop, setup, msi, portable, arm64, linux, macos, android, ios, web, cli, validate-windows, validate-desktop]
      signed_updates:
        description: Embed the Novera desktop update channel and sign updater bundles
        type: boolean
        default: false
        required: true

permissions:
  contents: read

concurrency:
  group: novera-candidates-${{ github.ref }}-${{ inputs.target }}-${{ inputs.signed_updates }}
  cancel-in-progress: true

env:
  CI: 'true'
  NOVERA_ENABLE_UPDATER: 'false'
  JAN_ENGINE_REQUIRE_SIGNING: '0'
  NOVERA_ANALYTICS_HOST: ''
  NOVERA_ANALYTICS_PROJECT_KEY: ''
  NODE_OPTIONS: --max-old-space-size=6144

jobs:
  checks:
    name: Source and future-version contracts
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0, Node 24
        with:
          node-version: 24
          package-manager-cache: false
      - name: Verify version, distribution and update contracts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .build/checks
          node scripts/distribution/check-release-readiness.mjs --json > .build/checks/source-definitions.json
          node --test scripts/distribution/__tests__/check-release-readiness.test.mjs scripts/distribution/__tests__/prepare-version.test.mjs scripts/distribution/__tests__/ci-candidates.test.mjs scripts/distribution/__tests__/ci-check-macos.test.mjs scripts/distribution/__tests__/ci-check-updater.test.mjs scripts/distribution/__tests__/cuda-redist-plan.test.mjs scripts/distribution/__tests__/record-upgrade-check.test.mjs scripts/__tests__/novera-update.test.mjs scripts/android/__tests__/configure-project.test.mjs | tee .build/checks/tests.txt
          python3 -m unittest discover -s scripts/distribution/checks -p 'test_validation_guards.py'
      - name: Retain source-check results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2, Node 24
        with:
          name: checks-${{ github.run_id }}
          path: .build/checks/
          if-no-files-found: ignore
          retention-days: 14

  desktop:
    name: ${{ matrix.variant }} / ${{ matrix.arch }}
    needs: checks
    env:
      NOVERA_ENABLE_UPDATER: ${{ inputs.signed_updates && 'true' || 'false' }}
    if: inputs.target == 'all' || inputs.target == 'native' || contains(fromJSON('["desktop","setup","msi","portable","arm64","linux","macos"]'), inputs.target)
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - {variant: windows, arch: x64, runner: windows-2025, engine: cuda13-vulkan}
          - {variant: arm64, arch: arm64, runner: windows-11-arm, engine: cpu}
          - {variant: linux, arch: x64, runner: ubuntu-22.04, engine: vulkan}
          - {variant: macos, arch: arm64, runner: macos-15, engine: metal}
          - {variant: macos, arch: x64, runner: macos-15-intel, engine: metal}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Select requested variant
        id: selection
        shell: bash
        env:
          REQUESTED: ${{ inputs.target }}
          VARIANT: ${{ matrix.variant }}
        run: |
          selected=false
          if [[ "$REQUESTED" == all || "$REQUESTED" == native || "$REQUESTED" == "$VARIANT" ]]; then selected=true; fi
          if [[ "$VARIANT" == windows && "$REQUESTED" =~ ^(desktop|setup|msi|portable)$ ]]; then selected=true; fi
          echo "selected=$selected" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0, Node 24
        if: steps.selection.outputs.selected == 'true'
        with:
          node-version: 24
          package-manager-cache: false
          architecture: ${{ matrix.arch }}
      - name: Native prerequisites
        if: steps.selection.outputs.selected == 'true'
        shell: bash
        run: bash scripts/distribution/ci-prerequisites.sh desktop
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
        if: steps.selection.outputs.selected == 'true' && runner.os == 'Windows'
        with:
          arch: ${{ matrix.arch }}
      - uses: ./.github/actions/setup-engine-toolchain
        if: steps.selection.outputs.selected == 'true'
        with:
          variant: ${{ matrix.engine }}
          cuda-release: ${{ matrix.variant == 'windows' && '13.4.3' || '' }}
      - name: Build clean candidate
        if: steps.selection.outputs.selected == 'true'
        shell: bash
        env:
          CANDIDATE_VARIANT: ${{ matrix.variant }}
          CANDIDATE_ARCH: ${{ matrix.arch }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ inputs.signed_updates && secrets.NOVERA_UPDATER_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ inputs.signed_updates && secrets.NOVERA_UPDATER_PASSWORD || '' }}
        run: bash scripts/distribution/ci-build.sh desktop
      - name: Retain candidates and checksums
        if: steps.selection.outputs.selected == 'true' && success()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2, Node 24
        with:
          name: Novera-${{ matrix.variant }}-${{ matrix.arch }}-${{ github.run_id }}
          path: .build/candidates/
          # The sanitized candidate includes the pinned image-runtime marker.
          # Excluding dotfiles here would invalidate its exhaustive SHA256SUMS.
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Retain failure diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2, Node 24
        with:
          name: diagnostics-${{ matrix.variant }}-${{ matrix.arch }}-${{ github.run_id }}
          path: |
            src-tauri/target/engine-build.log
            .build/ci-status.json
          if-no-files-found: ignore
          retention-days: 7

  auxiliary:
    name: ${{ matrix.variant }} / ${{ matrix.runner }}
    needs: checks
    if: inputs.target == 'all' || inputs.target == 'native' || contains(fromJSON('["web","cli","android","ios"]'), inputs.target)
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - {variant: web, runner: ubuntu-22.04}
          - {variant: cli, runner: ubuntu-22.04}
          - {variant: cli, runner: windows-2025}
          - {variant: cli, runner: macos-15}
          - {variant: android, runner: windows-2025}
          - {variant: ios, runner: macos-15}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Select requested variant
        id: selection
        shell: bash
        env:
          REQUESTED: ${{ inputs.target }}
          VARIANT: ${{ matrix.variant }}
        run: |
          if [[ "$REQUESTED" == all || "$REQUESTED" == "$VARIANT" || ( "$REQUESTED" == native && "$VARIANT" =~ ^(android|ios)$ ) ]]; then
            echo 'selected=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0, Node 24
        if: steps.selection.outputs.selected == 'true'
        with:
          node-version: 24
          package-manager-cache: false
      - name: Native prerequisites
        if: steps.selection.outputs.selected == 'true'
        shell: bash
        env:
          CANDIDATE_VARIANT: ${{ matrix.variant }}
        run: bash scripts/distribution/ci-prerequisites.sh "$CANDIDATE_VARIANT"
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
        if: steps.selection.outputs.selected == 'true' && runner.os == 'Windows'
        with:
          arch: x64
      - name: Select the native MSVC linker
        if: steps.selection.outputs.selected == 'true' && runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/distribution/ci-msvc.ps1
      - name: Build clean candidate
        if: steps.selection.outputs.selected == 'true'
        shell: bash
        env:
          CANDIDATE_VARIANT: ${{ matrix.variant }}
        run: bash scripts/distribution/ci-build.sh "$CANDIDATE_VARIANT"
      - name: Retain candidates and checksums
        if: steps.selection.outputs.selected == 'true' && success()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2, Node 24
        with:
          name: Novera-${{ matrix.variant }}-${{ runner.os }}-${{ github.run_id }}
          path: .build/candidates/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Retain failure diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2, Node 24
        with:
          name: diagnostics-${{ matrix.variant }}-${{ runner.os }}-${{ github.run_id }}
          path: .build/ci-status.json
          if-no-files-found: ignore
          retention-days: 7

  installed-update:
    name: Validate installed update / ${{ matrix.platform }}
    needs: checks
    if: inputs.target == 'validate-windows' || inputs.target == 'validate-desktop'
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - {platform: windows-x86_64, runner: windows-2025, arch: x64}
          - {platform: windows-aarch64, runner: windows-11-arm, arch: arm64}
          - {platform: linux-x86_64, runner: ubuntu-22.04, arch: x64}
          - {platform: darwin-aarch64, runner: macos-15, arch: arm64}
          - {platform: darwin-x86_64, runner: macos-15-intel, arch: x64}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Select validation target
        id: select
        shell: bash
        env:
          REQUESTED: ${{ inputs.target }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          selected=false
          if [[ "$REQUESTED" == validate-desktop || "$PLATFORM" == windows-x86_64 ]]; then selected=true; fi
          echo "selected=$selected" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0, Node 24
        if: steps.select.outputs.selected == 'true'
        with:
          node-version: 24
          package-manager-cache: false
          architecture: ${{ matrix.arch }}
      - name: Native validation prerequisites
        if: steps.select.outputs.selected == 'true'
        shell: bash
        run: bash scripts/distribution/ci-prerequisites.sh desktop
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
        if: steps.select.outputs.selected == 'true' && runner.os == 'Windows'
        with:
          arch: ${{ matrix.arch }}
      - name: Build the isolated native updater probe
        if: steps.select.outputs.selected == 'true'
        shell: bash
        env:
          CARGO_BUILD_JOBS: 2
        run: cargo build --locked --manifest-path scripts/distribution/checks/native-update/Cargo.toml --target-dir .build/native-update-probe
      - name: Install and exercise the reviewed signed package
        if: steps.select.outputs.selected == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          probe="$GITHUB_WORKSPACE/.build/native-update-probe/debug/novera-update-validation"
          if [[ "$RUNNER_OS" == Windows ]]; then probe="$probe.exe"; fi
          if [[ "$RUNNER_OS" == Linux ]]; then
            xvfb-run -a python3 scripts/distribution/validate-installed-update.py "$PLATFORM" "$probe"
          elif [[ "$RUNNER_OS" == Windows ]]; then
            python scripts/distribution/validate-installed-update.py "$PLATFORM" "$probe"
          else
            python3 scripts/distribution/validate-installed-update.py "$PLATFORM" "$probe"
          fi
      - name: Retain validation receipts only
        if: always() && steps.select.outputs.selected == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2, Node 24
        with:
          name: installed-update-${{ matrix.platform }}-${{ github.run_id }}
          path: .build/validation/*.json
          if-no-files-found: warn
          retention-days: 14

  summary:
    if: always()
    needs: [checks, desktop, auxiliary, installed-update]
    runs-on: ubuntu-22.04
    steps:
      - name: Report actual job results
        env:
          CHECKS: ${{ needs.checks.result }}
          DESKTOP: ${{ needs.desktop.result }}
          AUXILIARY: ${{ needs.auxiliary.result }}
          INSTALLED_UPDATE: ${{ needs.installed-update.result }}
        run: |
          printf 'Source and update contracts: %s\n' "$CHECKS" >> "$GITHUB_STEP_SUMMARY"
          printf 'Desktop matrix: %s\nAuxiliary matrix: %s\n' "$DESKTOP" "$AUXILIARY" >> "$GITHUB_STEP_SUMMARY"
          printf 'Isolated installed-update validation: %s\n' "$INSTALLED_UPDATE" >> "$GITHUB_STEP_SUMMARY"
          echo 'Candidates only. No public release, signing certification or device validation is implied.' >> "$GITHUB_STEP_SUMMARY"
          [[ "$CHECKS" == success && "$DESKTOP" != failure && "$AUXILIARY" != failure && "$DESKTOP" != cancelled && "$AUXILIARY" != cancelled && "$INSTALLED_UPDATE" != failure && "$INSTALLED_UPDATE" != cancelled ]]
